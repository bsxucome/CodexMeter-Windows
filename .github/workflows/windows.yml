name: Windows 构建与发布
on:
  push:
    tags: ['windows-v*']
    branches: ['main']
    paths: ['windows/**', '.github/workflows/windows.yml', 'UPSTREAM.md', 'LICENSE', 'README.md']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml', 'UPSTREAM.md', 'LICENSE']
  workflow_dispatch:
    inputs:
      operation:
        description: 'build: 构建和打包；release: 构建、打包并发布新版本'
        type: choice
        default: build
        options: [build, release]
permissions:
  contents: read
jobs:
  plan:
    name: 校验版本与发布请求
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: 检出固定提交的源码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 检查版本与发行条件
        id: plan
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OPERATION: ${{ inputs.operation || 'build' }}
        run: ./windows/scripts/prepare-actions-release.ps1
  build:
    name: 构建与打包 (${{ matrix.runtime }})
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [Framework, DotNet]
    steps:
      - name: 检出固定提交的源码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        if: matrix.runtime == 'DotNet'
        with:
          dotnet-version: '10.0.x'
      - name: 编译、测试与打包
        shell: powershell
        env:
          BUILD_RUNTIME: ${{ matrix.runtime }}
        run: |
          ./windows/scripts/validate-source.ps1
          ./windows/scripts/build.ps1 -Runtime $env:BUILD_RUNTIME -Publish
      - name: 发布工具与界面回归检查（Framework，串行执行）
        if: matrix.runtime == 'Framework'
        shell: powershell
        run: |
          ./windows/scripts/publishing-smoke.ps1
          ./windows/scripts/publish-ownership-smoke.ps1
          ./windows/scripts/publish-flow-smoke.ps1
          ./windows/scripts/release-scripts-smoke.ps1
          ./windows/scripts/sync-ci-smoke.ps1
          ./windows/scripts/github-page-smoke.ps1
          ./windows/scripts/actions-release-smoke.ps1
          ./windows/scripts/update-process-smoke.ps1
          ./windows/scripts/ui-smoke.ps1
          ./windows/scripts/indicator-smoke.ps1
          ./windows/scripts/features-smoke.ps1
          ./windows/scripts/advanced-smoke.ps1
          ./windows/scripts/release-smoke.ps1
      - name: 签署更新清单（需配置签名密钥）
        if: needs.plan.outputs.publish == 'true' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'release'))
        shell: powershell
        env:
          CODEXMETER_RELEASE_KEY_XML: ${{ secrets.WINDOWS_UPDATE_PRIVATE_KEY_XML }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          BUILD_RUNTIME: ${{ matrix.runtime }}
        run: |
          $version = $env:RELEASE_TAG.Substring(9)
          $source = [IO.File]::ReadAllText('windows/CodexMeter.Core/ProductVersion.cs')
          if ([regex]::Match($source, 'Current = "([^"]+)"').Groups[1].Value -ne $version) { throw 'Release tag does not match product version.' }
          if (!$env:CODEXMETER_RELEASE_KEY_XML) { Write-Output '未配置更新签名密钥，仅发布便携包。'; exit 0 }
          $runtime = if ($env:BUILD_RUNTIME -eq 'Framework') { 'framework-x64' } else { 'dotnet10-x64' }
          $channel = if ($version.Contains('-')) { 'beta' } else { 'stable' }
          $name = "CodexMeter-Windows-$version-$runtime.zip"
          ./windows/scripts/sign-release.ps1 -Archive "windows/artifacts/$name" -Version $version -Channel $channel -Runtime $runtime -PackageUrl "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/$name" -OutputDirectory windows/artifacts/feed
          Copy-Item -LiteralPath "windows/artifacts/feed/$channel-$runtime.json" -Destination windows/artifacts
          Copy-Item -LiteralPath windows/artifacts/feed/public-key.json -Destination "windows/artifacts/public-key-$runtime.json"
      - name: 上传便携包与校验文件
        uses: actions/upload-artifact@v7
        with:
          name: CodexMeter-Windows-${{ matrix.runtime }}
          path: |
            windows/artifacts/*.zip
            windows/artifacts/*.sha256
            windows/artifacts/*.json
          if-no-files-found: error
          retention-days: 14
  release:
    name: 发布 Windows 版本
    if: needs.plan.outputs.publish == 'true' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'release'))
    needs: [plan, build]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.repository }}-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: 检出固定提交的源码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 下载已验证的构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: CodexMeter-Windows-*
          merge-multiple: true
          path: release-assets
      - name: 发布已校验的便携包与可选更新源
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: ./windows/scripts/publish-release.ps1 -Repository $env:REPOSITORY -Tag $env:RELEASE_TAG -Directory release-assets -CreateTag -Commit $env:SOURCE_COMMIT
